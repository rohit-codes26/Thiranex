<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog Platform</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header>
    <h1>NeoBlog</h1>

    <input type="text" id="searchInput" placeholder="Search blogs...">
  </header>

  <section class="create-blog">
    <h2>Create New Blog</h2>

    <input type="text" id="title" placeholder="Blog Title">

    <textarea id="content" placeholder="Write your blog..."></textarea>

    <button id="publishBtn">Publish Blog</button>
  </section>

  <section id="blogContainer"></section>

  <script src="script.js"></script>
</body>
</html>
